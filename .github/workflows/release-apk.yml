name: Build and Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Build Web Application Bundle
        working-directory: apps/mobile
        run: npx vite build

      - name: Sync Android Project with Capacitor
        working-directory: apps/mobile
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x apps/mobile/android/gradlew

      - name: Build Android Debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK for Release
        run: |
          mkdir -p releases
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk releases/Universal-3D-Viewer-v1.0.0.apk
          ls -lh releases/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-3D-Viewer-APK
          path: releases/Universal-3D-Viewer-v1.0.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Universal 3D Viewer v1.0.0 (Android Release)"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: releases/Universal-3D-Viewer-v1.0.0.apk
          body: |
            ## 📱 Universal 3D Viewer v1.0.0

            Official Android Release of Universal 3D Viewer - an offline-first 3D and CAD viewer for Android.

            ### ✨ Features
            - **3D & CAD Format Support**: STEP / STP (CAD B-Rep assemblies), STL (3D printing), OBJ / MTL, PLY (vertex colors), and glTF / GLB.
            - **Filament-grade PBR Shading**: Metallic-roughness, ambient occlusion, real-time lighting.
            - **Render Modes**: Shaded PBR, Textured, Wireframe Topology, Surface Normals visualization, and Matcap CAD inspection.
            - **Hierarchy & Inspector**: Interactive scene graph tree with node selection and visibility toggles (hide/show), dimensional bounding box ($X \times Y \times Z$).
            - **Offline Storage**: SQLite database for recent files, favorites, and cache management.
            - **8-Stage State Machine**: `QUEUED` ➔ `VALIDATING` ➔ `DETECTING` ➔ `IMPORTING` ➔ `NORMALIZING` ➔ `OPTIMIZING` ➔ `CACHING` ➔ `READY`.

            ### 📥 Download
            Download and install **`Universal-3D-Viewer-v1.0.0.apk`** below on any Android device (Android 8.0+).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
